repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # Same version as in uv.lock
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1  # Same version as in uv.lock
    hooks:
      - id: nbstripout
        # Keep outputs and execution counts (the notebooks are deliverables),
        # drop the metadata that only adds noise to the diffs
        args:
          - --keep-output
          - --keep-count
          - --extra-keys=metadata.kernelspec metadata.language_info.version cell.metadata.execution
